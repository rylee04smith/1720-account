    <main>
        <h1>Account</h1>

        <!-- new profile using form inputs and save it to local storage -->
        <section id="signup" class="signup">
            <h2>Create a New Profile</h2>
            <form>
                <label>
                    Full Name: <input type="text" id="name" autocomplete="name" class="input" required>
                </label>
                <label>
                    Phone: <input type="tel" id="phone" autocomplete="tel" class="input" required>
                </label>
                <label>
                    Email: <input type="email" id="email" autocomplete="email" class="input" required>
                </label>
                <input class="button" type="submit" value="Create Profile">
            </form>
        </section>

        <!-- display profile information from local storage -->
        <section id="display" class="display">
            <h2>Your Profile</h2>
            <div></div>
            <button class="button" id="delete">Delete Profile</button>
        </section>



    </main>
